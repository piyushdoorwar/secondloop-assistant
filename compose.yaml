# Local stack for chapters 13 and 14.
#   cp .env.example .env    # fill in Shopify and Slack
#   docker compose up --build
name: secondloop

x-app: &app
  build: .
  env_file: .env
  environment: &env
    DATABASE_URL: postgresql://app:app@db:5432/secondloop
    OPS_API_URL: http://ops-api:8000
    OIDC_ISSUER: http://idp:8000
    OIDC_JWKS_URI: http://idp:8000/.well-known/jwks.json
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  depends_on:
    db:
      condition: service_healthy
  networks: [private]

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: secondloop
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app"]
      interval: 5s
    networks: [private]

  idp:
    <<: *app
    command: uvicorn secondloop.devidp.app:app
      --host 0.0.0.0 --port 8000
    depends_on: []
    ports: ["127.0.0.1:8100:8000"]

  ops-api:
    <<: *app
    command: uvicorn secondloop.ops_api.app:app
      --host 0.0.0.0 --port 8000

  mcp:
    <<: *app
    command: python -m secondloop.mcp_server.http
    environment:
      <<: *env
      BIND_HOST: 0.0.0.0
      PORT: "8001"
    ports: ["127.0.0.1:8001:8001"]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8001/readyz')"]
      interval: 10s

  console:
    <<: *app
    command: uvicorn secondloop.console.app:app
      --host 0.0.0.0 --port 8000
    ports: ["127.0.0.1:8002:8000"]

  worker:
    <<: *app
    command: python -m secondloop.workflow.run

  jaeger:
    image: jaegertracing/jaeger:2.8.0
    ports: ["127.0.0.1:16686:16686"]
    networks: [private]

networks:
  private: {}

volumes:
  pgdata: {}
