[project]
name = "secondloop-assistant"
version = "0.3.0"
description = "Companion project for From APIs to MCP with Python"
requires-python = ">=3.13"
dependencies = [
  "fastmcp==4.1.4",
  "fastapi==0.162.0",
  "anthropic==2.3.0",
  "slack_sdk==3.46.0",
  "httpx2==2.16.0",
  "pydantic==2.14.2",
  "PyJWT==2.15.1",
  "opentelemetry-sdk==1.45.2",
  "psycopg[binary]==3.3.6",
  "uvicorn==0.38.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["live: calls a real vendor or model; needs credentials"]
addopts = "-m 'not live'"
